<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hackénia — Les Enfants du Lac Rose</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <header>
      <div>
        <span class="eyebrow">HACKÉNIA • PROTOTYPE 0.1</span>
        <h1 id="title">Les Enfants du Lac Rose</h1>
      </div>
      <div class="dice">🎲 <span id="rollValue">—</span></div>
    </header>

    <section class="scene">
      <div id="art" class="art">🌲🌲🌲<br>🏰 &nbsp; Dassom &nbsp; 🏰<br>🌲🌲🌲</div>
      <div class="story">
        <h2 id="sceneTitle">L'entrée Nord de Dassom</h2>
        <p id="storyText"></p>
        <div id="dialogue"></div>
        <div id="choices" class="choices"></div>
      </div>
    </section>

    <section class="panel">
      <div><b>Groupe</b><br><span id="party">Aventurier + compagnon</span></div>
      <div><b>Réputation</b><br><span id="rep">0</span></div>
      <div><b>Inventaire</b><br><span id="inventory">Vide</span></div>
      <div><b>Journal</b><br><span id="journal">Mission : atteindre le Lac Rose.</span></div>
    </section>

    <footer>
      <button id="restart">↻ Recommencer</button>
      <span>Prototype jouable — aucune installation nécessaire.</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
