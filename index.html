<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hackénia 0.0.0.6</title><link rel="stylesheet" href="style.css"></head><body>
<section id="create" class="wrap"><div class="card"><div class="brand">HACKÉNIA</div><h1>Crée ton aventurier</h1><p>Prototype 0.0.0.6 — exploration, curiosité récompensée, interactions et jets.</p><div class="grid"><label>Nom<input id="name" value="Aldren"></label><label>Race<select id="race"><option>Humain</option><option>Elfe</option><option>Nain</option><option>Gnome</option><option>Demi-orc</option><option>Tieffelin</option></select></label><label>Classe<select id="klass"><option>Guerrier</option><option>Magicien</option><option>Barde</option><option>Clerc</option><option>Rôdeur</option><option>Roublard</option><option>Paladin</option></select></label></div><div id="stats" class="stats"></div><button id="start" class="primary">Commencer</button><p id="err"></p></div></section>
<section id="game" class="wrap" hidden><header><div><div class="brand mini">HACKÉNIA • 0.0.0.6</div><h2 id="place"></h2></div><div><button id="debugBtn">Debug : OFF</button> <button onclick="location.reload()">Nouvelle partie</button></div></header><main><aside><h3 id="who"></h3><div id="sheet"></div><hr><h4>Journal</h4><div id="journal"></div><hr><h4>Relations</h4><div id="relations"></div><hr><h4>Inventaire</h4><div id="inventory">—</div></aside><article><div id="sceneArt" class="sceneArt"></div><div id="reward" hidden>✨ IDÉE PERTINENTE — illustration découverte</div><div id="debug" hidden></div><div id="log"></div><div class="composer"><textarea id="action" placeholder="Que dis-tu ? Que fais-tu ? Qu'observes-tu ?"></textarea><button id="send" class="primary">Agir</button></div><div class="hint">Entrée = agir • Maj+Entrée = nouvelle ligne • observe, questionne et expérimente.</div></article></main></section>
<div id="dice"><div class="dicebox"><div id="d20">20</div><h2 id="dtitle"></h2><div id="dcalc"></div><strong id="dresult"></strong></div></div>
<script src="script.js"></script></body></html>
